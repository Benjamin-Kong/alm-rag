name: Foundation, collection and M6 quality and browser gates
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.9.18
      - run: uv sync --frozen
      - run: uv run python tools/validate_baseline.py
      - run: uv run python tools/validate_release.py
      - run: docker run -d --name almrag-m4-qdrant --tmpfs /qdrant/storage:rw --tmpfs /qdrant/snapshots:rw -p 127.0.0.1:16333:6333 -e QDRANT__SERVICE__API_KEY=synthetic-m4-only qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
      - run: uv run pytest -q
        env:
          ALMRAG_TEST_QDRANT_URL: http://127.0.0.1:16333
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime-lock.txt --quiet
      - run: uv tool run --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps -r /tmp/runtime-lock.txt
      - run: uv run python tools/export_openapi.py
      - run: npm ci && npm run generate:api && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - name: Preserve synthetic browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: git diff --exit-code -- docs/api/m6-openapi.json docs/api/openapi.yaml frontend/src/generated-api.d.ts
      - run: docker compose -p almrag-ci -f deploy/compose.yaml build
      - run: docker compose -p almrag-ci -f deploy/compose.yaml up -d --wait --wait-timeout 90
      - run: python -c "import urllib.request; assert b'ok' in urllib.request.urlopen('http://127.0.0.1:8080/api/v1/healthz').read()"
      - run: docker run --rm -i --network none --entrypoint python almrag-api:m6 - < tools/smoke_m2.py
      - run: docker run --rm -i --network none --entrypoint python almrag-api:m6 - < tools/smoke_m3.py
      - run: docker run --rm -i --network none --entrypoint python almrag-api:m6 - < tools/smoke_m4.py
      - run: docker run --rm -i --network none --entrypoint python almrag-api:m6 - < tools/smoke_m5.py
      - run: docker run --rm -i --network none --entrypoint python almrag-api:m6 - < tools/smoke_m6.py
      - name: Prepare isolated intranet HTTP acceptance
        id: intranet_env
        run: uv run python tools/smoke_intranet.py --write-env /tmp/almrag-intranet-ci.env
      - run: docker compose --env-file /tmp/almrag-intranet-ci.env -p almrag-intranet-ci -f deploy/compose.intranet.yaml --profile services up -d --build --wait --wait-timeout 120
      - name: Bootstrap synthetic intranet acceptance administrator
        run: docker compose --env-file /tmp/almrag-intranet-ci.env -p almrag-intranet-ci -f deploy/compose.intranet.yaml exec -T api python -c "from almrag.cli import database; from almrag.security import Security; Security(database()).bootstrap('synthetic-intranet-admin','synthetic intranet password')"
      - run: uv run python tools/smoke_intranet.py
      - run: docker compose --env-file /tmp/almrag-intranet-ci.env -p almrag-intranet-ci -f deploy/compose.intranet.yaml restart api worker
      - run: uv run python tools/smoke_intranet.py
      - run: docker compose --env-file /tmp/almrag-intranet-ci.env -p almrag-intranet-ci -f deploy/compose.intranet.yaml exec -T api python -m almrag.doctor
      - if: always() && steps.intranet_env.outcome == 'success'
        run: docker compose --env-file /tmp/almrag-intranet-ci.env -p almrag-intranet-ci -f deploy/compose.intranet.yaml --profile services down -v
      - if: always()
        run: docker compose -p almrag-ci -f deploy/compose.yaml down -v
