# M5 local runtime. Live ALM/model/vector are disabled by default; configured opt-in is required.
services:
  api:
    image: almrag-api:m5
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      ALMRAG_DATABASE_PATH: /app/data/alm.sqlite
      ALMRAG_QDRANT_URL: ${ALMRAG_QDRANT_URL:-http://host.docker.internal:6333}
      ALMRAG_OLLAMA_BASE_URL: ${ALMRAG_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ALMRAG_ALLOWED_ORIGIN: ${ALMRAG_ALLOWED_ORIGIN:-https://localhost:8443}
    volumes: [almrag_data:/app/data]
    ports: ["127.0.0.1:8000:8000"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
  worker:
    image: almrag-api:m5
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: ["python", "-m", "almrag.worker"]
    environment:
      ALMRAG_DATABASE_PATH: /app/data/alm.sqlite
      ALMRAG_QDRANT_URL: ${ALMRAG_QDRANT_URL:-http://host.docker.internal:6333}
      ALMRAG_OLLAMA_BASE_URL: ${ALMRAG_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes: [almrag_data:/app/data]
    healthcheck:
      test: [CMD, python, -m, almrag.worker, --health]
      interval: 5s
      timeout: 3s
      start_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
  frontend:
    image: almrag-frontend:m5
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
  qdrant:
    profiles: [services]
    image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]
volumes:
  almrag_data:
  qdrant_data:
