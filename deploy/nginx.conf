server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
  location / { try_files $uri $uri/ /index.html; }
  # Preflight/discovery of projects with many Trackers is paced by the ALM rate limit and can run for minutes.
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_connect_timeout 10s; proxy_send_timeout 3600s; proxy_read_timeout 3600s; }
}
