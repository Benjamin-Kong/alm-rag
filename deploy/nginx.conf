server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
}
