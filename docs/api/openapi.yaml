components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminSession:
      type: apiKey
      in: cookie
      name: almrag_session
      description: Secure HttpOnly SameSite=strict; unsafe methods require Origin
        and X-CSRF-Token.
  schemas:
    SearchRequest:
      type: object
      required:
      - query
      - project_uids
      properties:
        query:
          type: string
          minLength: 1
        project_uids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: Required non-empty list; the API rejects absent, empty, unauthorized
            or cross-project scopes.
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        response:
          $ref: '#/components/schemas/ResponseOptions'
    ResponseOptions:
      type: object
      properties:
        include_full_item:
          type: boolean
          default: false
        include_matched_chunks:
          type: boolean
          default: true
        include_chunk_text:
          type: boolean
          default: false
        max_chunks_per_item:
          type: integer
          minimum: 0
          maximum: 100
          default: 2
        include_relations:
          type: boolean
          default: false
        include_attachments:
          type: boolean
          default: false
    SearchResponse:
      type: object
      properties:
        total:
          type: integer
        results:
          type: array
          items:
            type: object
            required:
            - item_uid
            - project_uid
            - title
            - score
            properties:
              item_uid:
                type: string
              project_uid:
                type: string
              title:
                type: string
              source_url:
                type: string
                format: uri
              score:
                type: number
                description: RRF rank fusion score, not a probability or calibrated
                  confidence.
              matched_chunks:
                type: array
                items:
                  type: object
                  additionalProperties: true
              item:
                type: object
                additionalProperties: true
      required:
      - results
    AlmInstanceCreate:
      type: object
      required:
      - source_type
      - display_name
      - base_url
      - auth_ref
      properties:
        source_type:
          type: string
          enum:
          - codebeamer
          - polarion
        display_name:
          type: string
        base_url:
          type: string
          format: uri
        api_profile:
          type: string
        auth_ref:
          type: string
          description: Reference only, NEVER raw secret
        http_policy:
          $ref: '#/components/schemas/AlmHttpPolicy'
    AlmHttpPolicy:
      type: object
      properties:
        requests_per_second:
          type: number
          exclusiveMinimum: 0
          default: 2
        burst:
          type: integer
          minimum: 1
          default: 2
        max_inflight:
          type: integer
          minimum: 1
          default: 2
        min_interval_ms:
          type: integer
          minimum: 0
          default: 200
        timeout_seconds:
          type: number
          minimum: 1
          default: 30
        max_attempts:
          type: integer
          minimum: 1
          default: 5
    CollectionScope:
      type: object
      required:
      - selection_mode
      - scope_kind
      properties:
        selection_mode:
          type: string
          enum:
          - ALL
          - SELECTED
        scope_kind:
          type: string
          enum:
          - TRACKER
          - WORK_ITEM_TYPE
        source_scope_ids:
          type: array
          items:
            type: string
          uniqueItems: true
        project_uid:
          type: string
        embedding_fields:
          type: array
          items:
            type: string
      description: Validator must require >=1 source_scope_ids when selection_mode=SELECTED
        and enforce scope_kind matching ALM source_type; cross-property constraints
        enforced server-side.
    FailedItem:
      type: object
      properties:
        job_id:
          type: string
        item_uid:
          type: string
        failed_stage:
          type: string
          enum:
          - COLLECT
          - PROCESS
          - EMBED
          - INDEX
          - ATTACHMENT
        error_code:
          type: string
        retryable:
          type: boolean
        attempts:
          type: integer
        trace_id:
          type: string
        last_seen_at:
          type: string
          format: date-time
    RetryItemRequest:
      type: object
      properties:
        from_stage:
          type: string
          enum:
          - FAILED_STAGE
          - COLLECT
          - PROCESS
          - EMBED
          - INDEX
          default: FAILED_STAGE
        force_recollect:
          type: boolean
          default: false
        expected_revision_uid:
          type: string
    JobStatus:
      type: object
      properties:
        job_id:
          type: string
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - COMPLETED_WITH_ERRORS
          - RETRY_WAIT
          - PAUSED
          - BLOCKED
          - FAILED
          - CANCELLED
        processed_items:
          type: integer
        failed_items:
          type: integer
        skipped_items:
          type: integer
        total_items:
          type: integer
        last_error_code:
          type: string
      required:
      - job_id
      - state
    ApiError:
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - code
      - message
      - trace_id
      title: ApiError
      type: object
    ProjectInfo:
      properties:
        project_uid:
          type: string
          title: Project Uid
        alm_instance_uid:
          type: string
          title: Alm Instance Uid
        source_project_id:
          type: string
          title: Source Project Id
        name:
          type: string
          title: Name
      type: object
      required:
      - project_uid
      - alm_instance_uid
      - source_project_id
      - name
      title: ProjectInfo
    AdminLoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ApiKeyCreateRequest:
      type: object
      required:
      - name
      - project_uids
      - permissions
      properties:
        name:
          type: string
        project_uids:
          type: array
          minItems: 1
          items:
            type: string
        permissions:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - search
            - project_read
            - project_manage
            - system_admin
    PipelineJobRequest:
      type: object
      required:
      - stage
      properties:
        stage:
          type: string
          enum:
          - SYNC
          - COLLECT
          - PROCESS
          - EMBED
          - INDEX
          - REBUILD_INDEX
        force:
          type: boolean
          default: false
        config_revision:
          type: string
    JobAccepted:
      type: object
      required:
      - job_id
      - state
      properties:
        job_id:
          type: string
        state:
          type: string
          enum:
          - QUEUED
    ArtifactJobRequest:
      type: object
      properties:
        include_attachments:
          type: boolean
          default: true
        schema_version:
          type: string
        retention_policy:
          type: string
        import_mode:
          type: string
          enum:
          - MERGE_ONLY
          default: MERGE_ONLY
    ProjectRevisions:
      type: object
      properties:
        item_uid:
          type: string
        active_revision_uid:
          type: string
        revisions:
          type: array
          items:
            type: object
    EvaluationRequest:
      type: object
      required:
      - project_uids
      - dataset_ref
      properties:
        project_uids:
          type: array
          minItems: 1
          items:
            type: string
        dataset_ref:
          type: string
          description: Local server side reference, not raw data or arbitrary external
            URL
        methods:
          type: array
          items:
            type: string
            enum:
            - dense
            - keyword
            - hybrid
    ProjectImportRequest:
      type: object
      required:
      - artifact_ref
      - import_mode
      properties:
        artifact_ref:
          type: string
          description: Opaque reference to a previously validated local staging artifact;
            not a pathname or URL
        import_mode:
          type: string
          enum:
          - MERGE_ONLY
        expected_sha256:
          type: string
          minLength: 64
          maxLength: 64
    BackupRestoreRequest:
      type: object
      required:
      - manifest_hash
      - confirmation_nonce
      properties:
        manifest_hash:
          type: string
        confirmation_nonce:
          type: string
          description: One-use admin confirmation derived from server-side approval
            workflow, not arbitrary yes/no string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          title: Status
          default: ok
          enum:
          - ok
      type: object
      title: Health
    JobEvent:
      properties:
        event_id:
          type: integer
          title: Event Id
        job_id:
          type: string
          title: Job Id
        occurred_at:
          type: number
          title: Occurred At
        state:
          type: string
          title: State
        error_code:
          title: Error Code
          nullable: true
          type: string
      type: object
      required:
      - event_id
      - job_id
      - occurred_at
      - state
      title: JobEvent
    JobInfo:
      properties:
        job_id:
          type: string
          title: Job Id
        project_uid:
          type: string
          title: Project Uid
        stage:
          type: string
          title: Stage
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - COMPLETED_WITH_ERRORS
          - RETRY_WAIT
          - PAUSED
          - BLOCKED
          - FAILED
          - CANCELLED
          title: State
        last_error_code:
          title: Last Error Code
          nullable: true
          type: string
      type: object
      required:
      - job_id
      - project_uid
      - stage
      - state
      title: JobInfo
    KeyCreate:
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        project_uids:
          items:
            type: string
          type: array
          maxItems: 1000
          minItems: 1
          title: Project Uids
        permissions:
          items:
            type: string
            enum:
            - search
            - project_read
            - project_manage
            - system_admin
