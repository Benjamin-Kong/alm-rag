      - dataset_ref
      properties:
        project_uids:
          type: array
          minItems: 1
          items:
            type: string
        dataset_ref:
          type: string
          description: Local server side reference, not raw data or arbitrary external
            URL
        methods:
          type: array
          items:
            type: string
            enum:
            - dense
            - keyword
            - hybrid
    ProjectImportRequest:
      type: object
      required:
      - artifact_ref
      - import_mode
