components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminSession:
      type: apiKey
      in: cookie
      name: almrag_session
      description: Secure HttpOnly SameSite=strict; unsafe methods require Origin
        and X-CSRF-Token.
  schemas:
    SearchRequest:
      properties:
        query:
          type: string
          maxLength: 65536
          minLength: 1
          title: Query
        project_uids:
          items:
            type: string
          type: array
          maxItems: 1000
          minItems: 1
          title: Project Uids
        top_k:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Top K
          default: 10
        response:
          $ref: '#/components/schemas/ResponseOptions'
        filters:
          nullable: true
          $ref: '#/components/schemas/SearchFilters'
      additionalProperties: false
      type: object
      required:
      - query
      - project_uids
      title: SearchRequest
    ResponseOptions:
      properties:
        include_full_item:
          type: boolean
          title: Include Full Item
          default: false
        include_matched_chunks:
          type: boolean
          title: Include Matched Chunks
          default: true
        include_chunk_text:
          type: boolean
          title: Include Chunk Text
          default: false
        max_chunks_per_item:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Max Chunks Per Item
          default: 2
        include_relations:
          type: boolean
          title: Include Relations
          default: false
        include_attachments:
          type: boolean
          title: Include Attachments
          default: false
        include_scores:
          type: boolean
          title: Include Scores
          default: true
      additionalProperties: false
      type: object
      title: ResponseOptions
    SearchResponse:
      properties:
        total:
          type: integer
          title: Total
        results:
          items:
            $ref: '#/components/schemas/SearchHit'
          type: array
          title: Results
        exhausted:
          type: boolean
          title: Exhausted
        backfill_limited:
          type: boolean
          title: Backfill Limited
        rounds:
          type: integer
          title: Rounds
        unindexed_project_uids:
          items:
            type: string
          type: array
          title: Unindexed Project Uids
      type: object
      required:
      - total
      - results
      - exhausted
      - backfill_limited
      - rounds
      - unindexed_project_uids
      title: SearchResponse
    AlmInstanceCreate:
      type: object
      required:
      - source_type
      - display_name
      - base_url
      - auth_ref
      properties:
        source_type:
          type: string
          enum:
          - codebeamer
          - polarion
        display_name:
          type: string
        base_url:
          type: string
          format: uri
        api_profile:
          type: string
        auth_ref:
          type: string
          description: Reference only, NEVER raw secret
        http_policy:
          $ref: '#/components/schemas/AlmHttpPolicy'
    AlmHttpPolicy:
      type: object
      properties:
        requests_per_second:
          type: number
          exclusiveMinimum: 0
          default: 2
        burst:
          type: integer
          minimum: 1
          default: 2
        max_inflight:
          type: integer
          minimum: 1
          default: 2
        min_interval_ms:
          type: integer
          minimum: 0
          default: 200
        timeout_seconds:
          type: number
          minimum: 1
          default: 30
        max_attempts:
          type: integer
          minimum: 1
          default: 5
    CollectionScope:
      type: object
      required:
      - selection_mode
      - scope_kind
      properties:
        selection_mode:
          type: string
          enum:
          - ALL
          - SELECTED
        scope_kind:
          type: string
          enum:
          - TRACKER
          - WORK_ITEM_TYPE
        source_scope_ids:
          type: array
          items:
            type: string
          uniqueItems: true
        project_uid:
          type: string
        embedding_fields:
          type: array
          items:
            type: string
      description: Validator must require >=1 source_scope_ids when selection_mode=SELECTED
        and enforce scope_kind matching ALM source_type; cross-property constraints
        enforced server-side.
    FailedItem:
      type: object
      properties:
        job_id:
          type: string
        item_uid:
          type: string
        failed_stage:
          type: string
          enum:
          - COLLECT
          - PROCESS
          - EMBED
          - INDEX
          - ATTACHMENT
        error_code:
          type: string
        retryable:
          type: boolean
        attempts:
          type: integer
        trace_id:
          type: string
        last_seen_at:
          type: string
          format: date-time
    RetryItemRequest:
      properties:
        from_stage:
          type: string
          enum:
          - FAILED_STAGE
          - COLLECT
          - PROCESS
          - EMBED
          - INDEX
          title: From Stage
          default: FAILED_STAGE
        force_recollect:
          type: boolean
          title: Force Recollect
          default: false
        expected_revision_uid:
          title: Expected Revision Uid
          nullable: true
          type: string
      additionalProperties: false
      type: object
      title: RetryItemRequest
    JobStatus:
      type: object
      properties:
        job_id:
          type: string
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - COMPLETED_WITH_ERRORS
          - RETRY_WAIT
          - PAUSED
          - BLOCKED
          - FAILED
          - CANCELLED
        processed_items:
          type: integer
        failed_items:
          type: integer
        skipped_items:
          type: integer
        total_items:
          type: integer
        last_error_code:
          type: string
      required:
      - job_id
      - state
    ApiError:
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - code
      - message
      - trace_id
      title: ApiError
      type: object
    ProjectInfo:
      properties:
        project_uid:
          type: string
          title: Project Uid
        alm_instance_uid:
          type: string
          title: Alm Instance Uid
        source_project_id:
          type: string
          title: Source Project Id
        name:
          type: string
          title: Name
      type: object
      required:
      - project_uid
      - alm_instance_uid
      - source_project_id
      - name
      title: ProjectInfo
    AdminLoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ApiKeyCreateRequest:
      type: object
      required:
      - name
      - project_uids
      - permissions
      properties:
        name:
          type: string
        project_uids:
          type: array
          minItems: 1
          items:
            type: string
        permissions:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - search
            - project_read
            - project_manage
            - system_admin
    PipelineJobRequest:
      type: object
      required:
      - stage
