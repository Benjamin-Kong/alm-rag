[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "alm-rag"
version = "0.1.0"
description = "Read-only ALM retrieval foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "argon2-cffi>=23,<26",
    "cryptography>=50,<51",
    "httpx>=0.28,<1",
    "typer>=0.15,<1",
]

[project.scripts]
almrag = "almrag.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "PyYAML==6.0.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/almrag"]
